version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ["expo*", "@expo/*", "react-native*", "react", "react-dom", "jest-expo"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
