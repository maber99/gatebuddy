# Automatische Prüfung bei jedem Pull Request und jedem Push auf main.
# Ein Merge ist nur sinnvoll, wenn beide Jobs grün sind.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App – Typen, Lint, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    name: Datenbank – Migrationen, Zugriffsregeln, Geschäftslogik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Startet nur die Datenbank (ohne restliche Dienste) und spielt alle Migrationen ein
      - run: supabase db start
      - name: supabase test db
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee test-output.txt
      # Fehlerzeilen zusätzlich als Hinweise am Lauf ausgeben (auch ohne Protokoll-Download lesbar)
      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: |
          grep -nE "not ok|ERROR|FATAL|psql:|Dubious|Failed|Bad plan|No such file|error" test-output.txt \
            | head -n 9 \
            | sed -E 's/%/%25/g; s/\r//g' \
            | while IFS= read -r line; do echo "::error title=Datenbank-Test::${line}"; done
          echo "::error title=Datenbank-Test (Ende)::$(tail -n 5 test-output.txt | tr '\n' ' ' | cut -c1-900)"
