# Supabase CLI – lokale Entwicklungsumgebung (npx supabase start)
# Gilt NUR lokal. Einstellungen des gehosteten Projekts werden im Supabase-Dashboard gesetzt.
project_id = "gatebuddy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "gatebuddy://"
additional_redirect_urls = ["exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Anmeldung per Einmalcode (OTP), kein Passwort (ADR-008, vorgeschlagen)
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
